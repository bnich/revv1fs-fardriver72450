name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  openscad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad
      - name: Export every part and verify bounding boxes
        run: ./tools/build.sh
